name: Release Extension

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - 'docs/operations/lan-ci.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, sitegeist]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: source/sitegeist
    steps:
      - uses: actions/checkout@v4
        with:
          path: source/sitegeist
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: badlogic/mini-lit
          path: source/mini-lit
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: badlogic/pi-mono
          # Match the compatibility patch and development setup in README.md.
          ref: v0.60.0
          path: source/pi-mono
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install mini-lit
        working-directory: source/mini-lit
        run: npm install && npm run build

      - name: Install pi-mono
        working-directory: source/pi-mono
        run: |
          git apply ../sitegeist/scripts/pi-mono-sitegeist.patch
          npm install
          # Sitegeist bundles these packages directly from their TypeScript sources.

      - name: Install sitegeist
        run: npm install

      - name: Build extension
        run: npm run build

      - name: Create zip
        run: |
          cd dist-chrome
          find . -name "*.map" -type f -delete
          zip -r ../sitegeist.zip .

      - name: Extract version
        id: version
        run: echo "version=$(node -p "require('./dist-chrome/manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Extract changelog
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e "
            const fs = require('fs');
            const version = process.env.VERSION;
            const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
            const re = new RegExp('## \\\\[' + version.replace(/\\./g, '\\\\.') + '\\\\][^\\\\n]*\\n(.*?)(?=\\n## \\\\[|$)', 's');
            const match = changelog.match(re);
            let notes = match ? match[1].trim() : '';
            notes += '\n\n---\n\nDownload \`sitegeist.zip\`, unzip, and load as unpacked extension in Chrome/Edge.\n\nSee [installation instructions](https://sitegeist.ai/install.html) for details.';
            fs.writeFileSync('/tmp/release-notes.md', notes);
          "
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Create release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create ${{ github.ref_name }} sitegeist.zip \
            --title "Sitegeist ${{ steps.version.outputs.version }}" \
            --notes-file /tmp/release-notes.md \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
